openapi: 3.0.3
info:
  title: futureEnvirons API
  description: |
    Go backend for the futureEnvirons IoT platform.

    All successful responses use a standard envelope:

    ```json
    { "success": true, "data": { ... } }
    ```

    Errors use:

    ```json
    { "success": false, "error": { "code": "...", "message": "..." } }
    ```
  version: 1.0.0
  contact:
    name: futureEnvirons

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Service health probes
  - name: Auth
    description: Authentication

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Load balancer / ops probe (outside the versioned API prefix).
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthData"

  /api/v1/health:
    get:
      tags: [Health]
      summary: Versioned health check
      operationId: getV1Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthData"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Authenticates a user with email and password. Password verification uses bcrypt in Go.
        User details are loaded from `identity.sp_get_login_details`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email_id: admin@futureenvirons.com
              password: Admin@123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: invalid email or password
        "403":
          description: Account inactive, not approved, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: |
        Validates the access token. Server-side token invalidation will be added when
        `identity.refresh_session` exists. Clients should discard the token locally.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token returned by the login endpoint.

  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: "#/components/schemas/APIError"

    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
        message:
          type: string

    HealthData:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: futureEnvironsBE
        env:
          type: string
          example: development
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email_id, password]
      properties:
        email_id:
          type: string
          format: email
        password:
          type: string
          format: password

    Role:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
        role_code:
          type: string
        role_name:
          type: string

    UserProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        email_id:
          type: string
          format: email
        contact_no:
          type: string
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Token lifetime in seconds.
        user:
          $ref: "#/components/schemas/UserProfile"

    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: logged out

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
